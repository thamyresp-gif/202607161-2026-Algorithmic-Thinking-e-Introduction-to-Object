global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "orcamento-aluguel"
    environment: "production"

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: "orcamento-app"
    scrape_interval: 5s
    static_configs:
      - targets:
          - "app:9091"
          - "localhost:9091"
    metrics_path: "/metrics"

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

  - job_name: "otel-collector"
    static_configs:
      - targets:
          - "otel-collector:8889"

  - job_name: "grafana"
    static_configs:
      - targets:
          - "localhost:3000"